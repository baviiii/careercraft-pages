name: CI

# Deployment is handled by the Vercel GitHub integration, not here.
# This workflow only gates: it tells you a push is broken before Vercel ships it.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cheap greps first — they need no dependencies, so they fail in seconds.
      - name: Check for HTTP URLs (Security)
        run: |
          echo "Checking for insecure HTTP URLs..."
          if grep -rE "http://[a-zA-Z0-9]" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" packages/careercraft-web/src packages/shared/src supabase/functions --exclude-dir=node_modules | grep -v "http://127.0.0.1" | grep -v "http://localhost" | grep -v "// http" | grep -v "http-equiv"; then
            echo "❌ ERROR: Found HTTP URLs in production code!"
            echo "Please change all HTTP URLs to HTTPS except for localhost"
            exit 1
          else
            echo "✅ No insecure HTTP URLs found"
          fi

      - name: Check for exposed secrets
        run: |
          echo "Checking for potential secret leaks..."
          if grep -rE "(api[_-]?key|secret|password|token)\s*[=:]\s*['\"][^'\"].{8,}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" packages/careercraft-web/src packages/shared/src supabase/functions --exclude-dir=node_modules | grep -v "//.*API_KEY" | grep -v "example" | grep -v "placeholder"; then
            echo "⚠️  WARNING: Potential hardcoded secrets found!"
            echo "Please review and use environment variables instead"
            # Warns rather than fails: the pattern catches too many false positives to block on.
          else
            echo "✅ No obvious hardcoded secrets found"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The real gate. This is currently clean, so any failure here is a genuine regression.
      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check build output
        run: |
          DIST="packages/careercraft-web/dist"
          if [ ! -d "$DIST" ] || [ -z "$(ls -A "$DIST")" ]; then
            echo "❌ Build failed: $DIST is empty"
            exit 1
          fi
          echo "✅ Build successful"

      # Advisory only — there is a standing backlog of ~309 `no-explicit-any` errors.
      # Do not make this blocking until that backlog is cleared, or every run goes red.
      - name: Lint (advisory)
        run: npm run lint || echo "::warning::Lint reported problems (not blocking)"
