name: Deploy Supabase

# Edge functions deploy automatically. Migrations do not — they wait for a manual
# approval, because `db push` runs whatever SQL you wrote and some of that SQL is
# `DROP TABLE ... CASCADE` (see 20260903000000_retire_jobs_catalog.sql).
#
# ONE-TIME SETUP for the approval gate:
#   Settings → Environments → New environment → name it exactly: production-db
#   → tick "Required reviewers" → add yourself → Save.
# Without that environment the migrations job runs unGATED, so do this first.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # PRs: show which migrations *would* run. Touches nothing.
  # ---------------------------------------------------------------------------
  preview-migrations:
    name: Preview migrations (dry run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry run
        run: |
          echo "## 🔍 Migrations this PR would apply" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          supabase db push --linked --dry-run 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Edge functions: safe to automate. A bad deploy is fixed by redeploying.
  # ---------------------------------------------------------------------------
  functions:
    name: Deploy edge functions
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require credentials
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing repository secret: $var"
              missing=1
            fi
          done
          [ "$missing" = "1" ] && { echo "Add under Settings → Secrets and variables → Actions."; exit 1; }
          echo "✅ Credentials present"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Deploy
        run: |
          failed=""
          for func in supabase/functions/*/; do
            func_name=$(basename "$func")
            # Directories without an entrypoint (e.g. _shared) are libraries, not functions.
            if [ -f "$func/index.ts" ] || [ -f "$func/index.js" ]; then
              echo "→ Deploying $func_name"
              if ! supabase functions deploy "$func_name"; then
                failed="$failed $func_name"
              fi
            fi
          done
          if [ -n "$failed" ]; then
            echo "❌ Failed to deploy:$failed"
            exit 1
          fi
          echo "✅ All edge functions deployed"

  # ---------------------------------------------------------------------------
  # Migrations: gated. `environment:` is what makes this pause for approval.
  # ---------------------------------------------------------------------------
  migrations:
    name: Apply migrations (needs approval)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production-db
    # Never let two migration runs race each other. Queue, don't cancel.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require credentials
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing repository secret: $var"
              missing=1
            fi
          done
          [ "$missing" = "1" ] && { echo "Add under Settings → Secrets and variables → Actions."; exit 1; }
          echo "✅ Credentials present"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # Last look before anything is written.
      - name: Show what will be applied
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        run: supabase db push --linked

      - name: Summary
        if: always()
        run: |
          echo "## 🗄️ Migrations" >> $GITHUB_STEP_SUMMARY
          echo "- Project: \`$PROJECT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- Result: **${{ job.status }}**" >> $GITHUB_STEP_SUMMARY
