# ⚠️  THIS BLOCK CONFIGURES THE LOCAL STACK ONLY (`supabase start`).
#
# Production auth URLs live in the Supabase dashboard, under
# Authentication → URL Configuration. Nothing here reaches them: neither
# `supabase db push` nor `supabase functions deploy` — the two commands the
# deploy workflow runs — read these keys. Changing this file and pushing to
# main will not move production a millimetre.
#
# `supabase config push` WOULD overwrite the dashboard with these values. It is
# deliberately not in the pipeline. If you ever run it by hand, read this block
# first — site_url below is a localhost address, and pushing it would break
# every production auth redirect.
#
# (This block previously pointed at careercraft.ai, a domain that was never
# owned, with a dev port that was never used. It looked authoritative and did
# nothing for months. Hence the sign.)
[auth]
enabled = true
# Local Vite dev server — see packages/careercraft-web/vite.config.ts:9.
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://127.0.0.1:8080",
  # Listed so a stray `config push` degrades to "wrong site_url" rather than
  # "production redirects rejected outright".
  "https://faircopy.au",
  "https://www.faircopy.au",
  "https://career-craft.bavi.au",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Subjects and bodies for the mail Supabase sends. Like the rest of this file
# these apply to `supabase start` only — production templates are pasted into
# the dashboard, which is why supabase/templates/README.md exists.
#
# Keeping them here anyway is the point: local mail then looks like production
# mail, so a broken link or a mangled variable shows up at Inbucket
# (http://127.0.0.1:54324) instead of in someone's inbox.
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Set a new password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/change-email.html"

[auth.email.template.invite]
subject = "You've been invited to Faircopy"
content_path = "./supabase/templates/invite.html"

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# One block per function that exists in supabase/functions/. This list had
# drifted badly: seven entries named functions that had been deleted, while six
# live ones — including infer, the least guarded of them — had no entry at all.

[functions.ats-analyze]
verify_jwt = true

[functions.rewrite-resume]
verify_jwt = true

[functions.parse-resume]
# false so guests can paste résumé text and get a real AI read without an
# account. Auth is not skipped — it moved inside the function: optionalUser()
# resolves a session when there is one (plan quota, billed to that user) and
# falls back to IP + global rate limits for guests. File uploads still require
# a session and are rejected in-handler.
verify_jwt = false

[functions.onboard-analyze]
verify_jwt = true

[functions.job-news]
verify_jwt = true

[functions.generate-prompt]
verify_jwt = true

[functions.horus-rag]
verify_jwt = true

# The Career Coach chat: relays the Horus agent's SSE stream for a signed-in
# user. The gateway check stays on; the browser sends its session token.
[functions.coach-chat]
verify_jwt = true

[functions.job-email-events]
verify_jwt = true

# Settings → "Delete account". Deletes only the caller's own data and login.
[functions.delete-account]
verify_jwt = true

[functions.job-search]
verify_jwt = true

# Pre-auth analytics events arrive without a session, so the JWT is checked
# inside the function rather than at the gateway.
[functions.track-session]
verify_jwt = false

# The MCP presents a shared secret rather than a Supabase JWT, so the gateway
# check has to stay off; the function authenticates the caller itself and, when
# a real user token is present, consumes that user's plan.
[functions.infer]
verify_jwt = false