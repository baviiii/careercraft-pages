[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://careercraft.ai"
additional_redirect_urls = ["https://careercraft.ai", "http://localhost:3000", "http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# One block per function that exists in supabase/functions/. This list had
# drifted badly: seven entries named functions that had been deleted, while six
# live ones — including infer, the least guarded of them — had no entry at all.

[functions.ats-analyze]
verify_jwt = true

[functions.rewrite-resume]
verify_jwt = true

[functions.parse-resume]
verify_jwt = true

[functions.onboard-analyze]
verify_jwt = true

[functions.job-news]
verify_jwt = true

[functions.generate-prompt]
verify_jwt = true

[functions.horus-rag]
verify_jwt = true

[functions.job-fit-score]
verify_jwt = true

[functions.job-email-events]
verify_jwt = true

[functions.job-search]
verify_jwt = true

# Pre-auth analytics events arrive without a session, so the JWT is checked
# inside the function rather than at the gateway.
[functions.track-session]
verify_jwt = false

# The MCP presents a shared secret rather than a Supabase JWT, so the gateway
# check has to stay off; the function authenticates the caller itself and, when
# a real user token is present, consumes that user's plan.
[functions.infer]
verify_jwt = false