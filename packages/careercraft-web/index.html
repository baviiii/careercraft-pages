<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/faircopy-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/faircopy-favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Faircopy: plan your next career move in Australia</title>
    <meta name="description" content="Work out where you're headed, get ready for the market, then go for the role. Career coaching, résumés, interview practice and job tracking for Australia." />
    <meta name="author" content="Faircopy" />

    <!-- Link previews. Share bots don't run JS, so these are what every shared
         link shows. URLs must be absolute or most platforms drop them. -->
    <meta property="og:site_name" content="Faircopy" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.faircopy.au/" />
    <meta property="og:title" content="Faircopy: plan your next career move in Australia" />
    <meta property="og:description" content="Work out where you're headed, get ready for the market, then go for the role. Career coaching, résumés, interview practice and job tracking for Australia." />
    <meta property="og:image" content="https://www.faircopy.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Faircopy logo: an open book with a path running through it." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.faircopy.au/og-image.png" />

    <!-- Who we are, for search engines. WebSite sets the site name Google shows
         above results; Organization ties "Faircopy" to this domain and logo
         rather than to the dictionary phrase "fair copy". When the LinkedIn /
         Product Hunt profiles exist, list them under Organization "sameAs". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.faircopy.au/#website",
            "name": "Faircopy",
            "alternateName": ["faircopy.au", "Faircopy Australia"],
            "url": "https://www.faircopy.au/",
            "inLanguage": "en-AU",
            "publisher": { "@id": "https://www.faircopy.au/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://www.faircopy.au/#organization",
            "name": "Faircopy",
            "url": "https://www.faircopy.au/",
            "logo": "https://www.faircopy.au/brand/faircopy-mark.png",
            "description": "A career workspace for the Australian job market: résumé builder, ATS check, cover letters, job tracker, interview practice and a career coach.",
            "areaServed": { "@type": "Country", "name": "Australia" }
          }
        ]
      }
    </script>

    <!-- Editorial Typography -->
    <!-- Self-hosted fonts (src/styles/fonts.css). The two the first screen uses are fetched early. -->
    <link rel="preload" href="/fonts/bricolage-normal-300-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-normal-300-900-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Security Headers (CSP relaxed for development) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set as HTTP header, not meta tag -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
