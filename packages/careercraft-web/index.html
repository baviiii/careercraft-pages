<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/faircopy-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/brand/faircopy-favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <title>Faircopy: résumé builder for the Australian job market</title>
    <meta name="description" content="Build the résumé, aim it at the job, track every application. One calm workspace for the Australian job market." />
    <meta name="author" content="Faircopy" />

    <!-- Link previews. Share bots don't run JS, so these are what every shared
         link shows. URLs must be absolute or most platforms drop them. -->
    <meta property="og:site_name" content="Faircopy" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.faircopy.au/" />
    <meta property="og:title" content="Faircopy: résumé builder for the Australian job market" />
    <meta property="og:description" content="Build the résumé, aim it at the job, track every application. One calm workspace for the Australian job market." />
    <meta property="og:image" content="https://www.faircopy.au/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Faircopy logo: an open book with a path running through it." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.faircopy.au/og-image.png" />

    <!-- Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Gelasio:ital,wght@0,400;0,700&display=swap" rel="stylesheet" />

    <!-- Security Headers (CSP relaxed for development) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options must be set as HTTP header, not meta tag -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
